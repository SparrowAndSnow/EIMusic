#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2560M

#Gradle
org.gradle.jvmargs=-Xmx2560M -Dfile.encoding=GBK

#Android
# AGP 9 起内置 Kotlin 与新 DSL 默认开启，会与 Kotlin Multiplatform 的 androidTarget 冲突；
# 项目仍使用传统 com.android.* + KMP 组合，因此显式关闭这两个开关。
android.builtInKotlin=false
android.newDsl=false
android.nonTransitiveRClass=true
android.useAndroidX=true

