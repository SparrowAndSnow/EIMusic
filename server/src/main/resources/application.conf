ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    
    application {
        modules = [ com.eimsound.eimusic.server.ApplicationKt.module ]
    }
}

server {
    # 服务器配置
    port = 8080
    host = "0.0.0.0"
    
    # 频道配置
    maxChannels = 1000
    maxUsersPerChannel = 50
    channelCleanupInterval = 300  # 秒
    
    # 连接配置
    maxConnections = 10000
    heartbeatInterval = 30  # 秒
    connectionTimeout = 60  # 秒
    
    # 日志配置
    logLevel = "INFO"
}