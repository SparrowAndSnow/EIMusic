name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Mosaic composite build
        run: git clone --depth 1 https://github.com/SparrowAndSnow/mosaic.git mosaic

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared/server/desktop
        run: |
          chmod +x gradlew
          ./gradlew \
            :shared:compileKotlinJvm \
            :shared:jvmTest \
            :server:test \
            :server:buildFatJar \
            :composeApp:compileKotlinDesktop \
            --no-daemon --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Compile terminal (Linux)
        run: ./gradlew :terminalApp:compileKotlinLinuxX64 --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            server/build/libs/*-all.jar
          if-no-files-found: ignore
