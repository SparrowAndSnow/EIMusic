name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared/server/desktop
        run: |
          chmod +x gradlew
          ./gradlew \
            :shared:compileKotlinJvm \
            :shared:jvmTest \
            :server:test \
            :server:buildFatJar \
            :composeApp:compileKotlinDesktop \
            --no-daemon --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            server/build/libs/*-all.jar
          if-no-files-found: ignore

  terminal-debug-link:
    name: Terminal debug link (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-15
            name: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up MSYS2 MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux link dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libsystemd-dev

      - name: Verify MinGW tools are available to Gradle
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: MSYS2_ARG_CONV_EXCL='*' cmd.exe /d /c 'where x86_64-w64-mingw32-gcc && where ar'

      - name: Link terminal debug (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :terminalApp:linkDebugExecutableLinuxX64 --no-daemon --stacktrace

      - name: Link terminal debug (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: MSYS2_ARG_CONV_EXCL='*' cmd.exe /d /c 'gradlew.bat :terminalApp:linkDebugExecutableMingwX64 --no-daemon --stacktrace'

      - name: Link terminal debug and release (macOS ARM64)
        if: runner.os == 'macOS'
        run: |
          ./gradlew \
            :terminalApp:linkDebugExecutableMacosArm64 \
            :terminalApp:linkReleaseExecutableMacosArm64 \
            --no-daemon --stacktrace
          test -f terminalApp/build/bin/macosArm64/releaseExecutable/eimusic.kexe
