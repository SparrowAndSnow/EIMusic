name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  backend:
    name: Build backend and Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Mosaic composite build
        run: git clone --depth 1 https://github.com/SparrowAndSnow/mosaic.git mosaic

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend and APK
        run: |
          chmod +x gradlew
          ./gradlew :server:buildFatJar :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Stage backend artifacts
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk dist/
          cp server/build/libs/server-all.jar dist/

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: dist

  terminal:
    name: Build terminal (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          # macos-latest intentionally omitted for now

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Mosaic composite build
        run: git clone --depth 1 https://github.com/SparrowAndSnow/mosaic.git mosaic

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up MSYS2 MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build terminal (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :terminalApp:linkReleaseExecutableLinuxX64 --no-daemon --stacktrace

      - name: Build terminal (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat :terminalApp:linkReleaseExecutableMingwX64 --no-daemon --stacktrace

      - name: Stage terminal binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.name }}" = "linux" ]; then
            cp terminalApp/build/bin/linuxX64/releaseExecutable/eimusic.kexe dist/
          else
            cp terminalApp/build/bin/mingwX64/releaseExecutable/eimusic.exe dist/
          fi

      - name: Upload terminal binary
        uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.name }}
          path: dist

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [backend, terminal]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: release

      - name: Download terminal binaries
        uses: actions/download-artifact@v4
        with:
          pattern: terminal-*
          merge-multiple: true
          path: release

      - name: Prepare release
        run: |
          VERSION=$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open("version.toml", "rb"))["version"]["name"])
          PY
          )
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version.toml v${VERSION}" >&2
            exit 1
          fi
          test -f "release/server-all.jar"
          test -f "release/eimusic.kexe"
          test -f "release/eimusic.exe"
          ls -lh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eimusic-backend"
          docker build -f server/Dockerfile -t "${IMAGE}:${GITHUB_REF_NAME}" -t "${IMAGE}:latest" release
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:latest"
