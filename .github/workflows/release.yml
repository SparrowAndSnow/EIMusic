name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  terminal-windows:
    name: Build terminal (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Mosaic composite build
        run: git clone --depth 1 https://github.com/SparrowAndSnow/mosaic.git mosaic

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build terminal release
        run: ./gradlew.bat :terminalApp:linkReleaseExecutableMingwX64 --no-daemon --stacktrace

      - name: Stage terminal binary
        shell: pwsh
        run: Copy-Item "terminalApp/build/bin/mingwX64/releaseExecutable/eimusic.exe" "eimusic.exe"

      - name: Upload terminal artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-windows
          path: eimusic.exe

  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: terminal-windows
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Mosaic composite build
        run: git clone --depth 1 https://github.com/SparrowAndSnow/mosaic.git mosaic

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: |
          chmod +x gradlew
          ./gradlew \
            :server:buildFatJar \
            :androidApp:assembleDebug \
            :terminalApp:linkReleaseExecutableLinuxX64 \
            --no-daemon --stacktrace

      - name: Download Windows terminal
        uses: actions/download-artifact@v4
        with:
          name: terminal-windows
          path: release

      - name: Prepare release files
        run: |
          VERSION=$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open("version.toml", "rb"))["version"]["name"])
          PY
          )
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version.toml v${VERSION}" >&2
            exit 1
          fi
          mkdir -p release
          cp "androidApp/build/outputs/apk/debug/EIMusic-${VERSION}.apk" "release/EIMusic-${VERSION}.apk"
          cp "server/build/libs/server-all.jar" "release/server-all.jar"
          cp "terminalApp/build/bin/linuxX64/releaseExecutable/eimusic.kexe" "release/eimusic.kexe"
          # Windows artifact is downloaded as release/eimusic.exe
          test -f "release/eimusic.exe"
          ls -lh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eimusic-backend"
          docker build -f server/Dockerfile -t "${IMAGE}:${GITHUB_REF_NAME}" -t "${IMAGE}:latest" server/build/libs
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:latest"
